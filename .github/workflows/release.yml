name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            bundle-command: pnpm desktop:bundle:macos
            artifact-glob: |
              target/release/bundle/macos/*.app.tar.gz
              target/release/bundle/macos/*.app.tar.gz.sig
              target/release/bundle/dmg/*.dmg
          - platform: windows
            os: windows-latest
            bundle-command: pnpm desktop:bundle:windows
            artifact-glob: |
              target/release/bundle/msi/*.msi
              target/release/bundle/msi/*.msi.sig
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/*.exe.sig
          - platform: linux
            os: ubuntu-latest
            bundle-command: pnpm desktop:bundle:linux
            artifact-glob: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/appimage/*.AppImage.sig
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Record release context
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "macos" && -n "${APPLE_CERTIFICATE}" ]]; then
            platform_signed=true
          elif [[ "${{ matrix.platform }}" == "windows" && -n "${WINDOWS_CERTIFICATE}" ]]; then
            platform_signed=true
          else
            platform_signed=false
          fi
          printf '{"platform":"%s","signed":%s}\n' "${{ matrix.platform }}" "$platform_signed" > "release-context-${{ matrix.platform }}.json"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}

      - name: Bundle
        shell: bash
        env:
          # AIPROXY_UPDATER_ARTIFACTS flips `bundle.createUpdaterArtifacts`
          # on through scripts/desktop.mjs, but only when a signing key is
          # configured. Without TAURI_SIGNING_PRIVATE_KEY the `tauri build`
          # signing step fails hard, so keep it off and ship plain
          # installers (no `.sig`, no `latest.json`, auto-update disabled)
          # until the key is available.
          #
          # Note: `&&`/`||` in expressions yield booleans, not operands, and
          # `'0'` is truthy, so a `&& '1' || '0'` chain ALWAYS evaluates to
          # true. Use a plain boolean comparison instead ("true"/"false").
          AIPROXY_UPDATER_ARTIFACTS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          BUNDLE_COMMAND: ${{ matrix.bundle-command }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # On macOS, if no Apple certificate is configured, disable codesign
          # auto-discovery and clear the cert env vars so Tauri doesn't try
          # to import an empty keychain certificate.
          if [[ "$PLATFORM" == "macos" && -z "$APPLE_CERTIFICATE" ]]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset APPLE_CERTIFICATE
            unset APPLE_CERTIFICATE_PASSWORD
            unset APPLE_SIGNING_IDENTITY
            unset APPLE_API_ISSUER
            unset APPLE_API_KEY
            unset APPLE_API_KEY_PATH
          fi
          echo "AIPROXY_UPDATER_ARTIFACTS=${AIPROXY_UPDATER_ARTIFACTS:-<unset>}"
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY: configured"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY: NOT configured"
          fi
          eval "$BUNDLE_COMMAND"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aiproxy-${{ matrix.platform }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

      - name: Write updater platform metadata
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            macos)
              arch="$(uname -m)"
              if [[ "$arch" == "arm64" ]]; then
                updater_platform="darwin-aarch64"
              else
                updater_platform="darwin-x86_64"
              fi
              ;;
            linux)
              arch="$(uname -m)"
              if [[ "$arch" == "aarch64" || "$arch" == "arm64" ]]; then
                updater_platform="linux-aarch64"
              else
                updater_platform="linux-x86_64"
              fi
              ;;
            windows)
              updater_platform="windows-x86_64"
              ;;
          esac
          printf '{"bundle":"%s","platform":"%s"}\n' "${{ matrix.platform }}" "$updater_platform" > "updater-platform-${{ matrix.platform }}.json"

      - name: Upload release context
        uses: actions/upload-artifact@v4
        with:
          name: release-context-${{ matrix.platform }}
          path: release-context-${{ matrix.platform }}.json

      - name: Upload updater platform metadata
        uses: actions/upload-artifact@v4
        with:
          name: updater-platform-${{ matrix.platform }}
          path: updater-platform-${{ matrix.platform }}.json

  publish:
    name: Publish GitHub Release
    needs: bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate release reference and notes
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Release workflow must run from a version tag (for example v0.1.19)." >&2
            exit 1
          fi

          notes_path="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes_path" ]]; then
            echo "Missing required bilingual release notes: $notes_path" >&2
            exit 1
          fi

          if ! grep -q '^## 更新内容' "$notes_path" || ! grep -Fq "## What's new" "$notes_path"; then
            echo "$notes_path must contain both '## 更新内容' and '## What's new' sections." >&2
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate updater manifest
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const repo = "small-dream/AIProxy";
          const tag = process.env.GITHUB_REF_NAME;
          const version = tag.startsWith("v") ? tag.slice(1) : tag;
          const root = path.resolve("release-artifacts");
          const notesPath = path.join("docs", "releases", `${tag}.md`);
          const releaseNotes = fs.readFileSync(notesPath, "utf8").trim();

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          const files = walk(root);
          const byName = new Map(files.map((file) => [path.basename(file), file]));
          const platformByBundle = new Map(
            files
              .filter((file) => path.basename(file).startsWith("updater-platform-"))
              .map((file) => {
                const metadata = JSON.parse(fs.readFileSync(file, "utf8"));
                return [metadata.bundle, metadata.platform];
              }),
          );

          function pick(match) {
            return files.find((file) => match(path.basename(file)));
          }

          function assetUrl(file) {
            const name = encodeURIComponent(path.basename(file));
            return `https://github.com/${repo}/releases/download/${tag}/${name}`;
          }

          // Only include a platform in the updater manifest when its .sig is present.
          // When no signing key is configured, no .sig files exist, so the manifest
          // is skipped entirely and the release ships plain installers.
          function signatureFor(file) {
            const sig = byName.get(`${path.basename(file)}.sig`);
            return sig ? fs.readFileSync(sig, "utf8").trim() : null;
          }

          const platforms = {};
          const mac = pick((name) => name.endsWith(".app.tar.gz"));
          const linux = pick((name) => name.endsWith(".AppImage"));
          const windows = pick((name) => name.endsWith(".exe")) ?? pick((name) => name.endsWith(".msi"));

          if (mac) {
            const signature = signatureFor(mac);
            if (signature) platforms[platformByBundle.get("macos") ?? "darwin-x86_64"] = { signature, url: assetUrl(mac) };
          }
          if (linux) {
            const signature = signatureFor(linux);
            if (signature) platforms[platformByBundle.get("linux") ?? "linux-x86_64"] = { signature, url: assetUrl(linux) };
          }
          if (windows) {
            const signature = signatureFor(windows);
            if (signature) platforms[platformByBundle.get("windows") ?? "windows-x86_64"] = { signature, url: assetUrl(windows) };
          }

          if (Object.keys(platforms).length === 0) {
            console.log("No signed updater artifacts found — skipping latest.json. Installers will still be published without auto-update support.");
          } else {
            fs.writeFileSync(
              "latest.json",
              `${JSON.stringify({ version, notes: releaseNotes, pub_date: new Date().toISOString(), platforms }, null, 2)}\n`,
            );
            console.log("Wrote latest.json with", Object.keys(platforms).length, "platform(s).");
          }
          NODE

      - name: Build release notes
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const tag = process.env.GITHUB_REF_NAME;
          const sourceNotes = fs.readFileSync(path.join("docs", "releases", `${tag}.md`), "utf8").trim();
          const artifactsRoot = path.resolve("release-artifacts");
          const contexts = fs.readdirSync(artifactsRoot, { withFileTypes: true })
            .filter((entry) => entry.isDirectory() && entry.name.startsWith("release-context-"))
            .map((entry) => JSON.parse(fs.readFileSync(path.join(artifactsRoot, entry.name, `release-context-${entry.name.replace("release-context-", "")}.json`), "utf8")));
          const isSigned = (platform) => contexts.find((context) => context.platform === platform)?.signed === true;
          const hasUpdater = fs.existsSync("latest.json");

          const chinese = [
            "## 安装与更新",
            "",
            "- Windows：下载 `.msi` 或 `.exe` 安装包。",
            "- macOS：下载 `.dmg` 安装包。",
            "- Linux：下载 `.AppImage`、`.deb` 或 `.rpm` 安装包。",
            hasUpdater
              ? "- 本版本支持应用内更新；可在 **设置 → 软件更新** 中检查更新。"
              : "- 本版本暂不支持应用内更新；请下载最新安装包并手动安装。",
          ];
          if (!isSigned("macos")) {
            chinese.push("- macOS 安装包未签名。若浏览器下载后显示“已损坏”，将应用移至“应用程序”目录后执行 `xattr -cr /Applications/AIProxy.app`。");
          }
          if (!isSigned("windows")) {
            chinese.push("- Windows 安装包未签名，首次运行时可能出现 SmartScreen 提示；请确认下载来源为本 Release 页面。");
          }

          const english = [
            "## Install and update",
            "",
            "- Windows: download the `.msi` or `.exe` installer.",
            "- macOS: download the `.dmg` installer.",
            "- Linux: download the `.AppImage`, `.deb`, or `.rpm` package.",
            hasUpdater
              ? "- In-app updates are available in **Settings → Software Updates**."
              : "- In-app updates are not available for this release. Download and install the latest package manually.",
          ];
          if (!isSigned("macos")) {
            english.push("- The macOS package is unsigned. If macOS says the browser-downloaded app is damaged, move it to Applications and run `xattr -cr /Applications/AIProxy.app`.");
          }
          if (!isSigned("windows")) {
            english.push("- The Windows package is unsigned. SmartScreen may appear on first launch; verify that you downloaded it from this Release page.");
          }

          fs.writeFileSync("release-notes.md", `${sourceNotes}\n\n${chinese.join("\n")}\n\n---\n\n${english.join("\n")}\n`);
          NODE

      - name: Collect installers
        run: |
          # `*.app.tar.gz` is the macOS updater package referenced by latest.json;
          # without it published, macOS auto-update 404s even with a valid signature.
          find release-artifacts/aiproxy-* -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.msi" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.sig" \) -exec cp {} . \;
          ls -lh *.dmg *.app.tar.gz *.msi *.exe *.AppImage *.deb *.rpm *.sig 2>/dev/null || echo "No installers found!"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-test') || contains(github.ref_name, '-beta') }}
          body_path: release-notes.md
          files: |
            *.dmg
            *.app.tar.gz
            *.msi
            *.exe
            *.AppImage
            *.deb
            *.rpm
            *.sig
            latest.json
