[package]
name = "aiproxy-desktop"
edition.workspace = true
license.workspace = true
version.workspace = true
autobins = false
default-run = "AIProxy"

[[bin]]
name = "AIProxy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
aiproxy-db = { path = "../../../crates/db" }
aiproxy-proxy-core = { path = "../../../crates/proxy-core" }
aiproxy-rule-engine = { path = "../../../crates/rule-engine" }
aiproxy-sys-util = { path = "../../../crates/sys-util" }
aiproxy-tls-manager = { path = "../../../crates/tls-manager" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync"] }
dirs = "6"
mime_guess = "2"
percent-encoding = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
tracing-appender = "0.2"
rust-i18n = "4"
sys-locale = "0.3"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for export writes: refuse a symbolic link in the final path
# component atomically instead of a check-then-write race.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinInet", "Win32_Globalization"] }
winreg = "0.56"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
