[package]
name = "aiproxy-desktop"
edition.workspace = true
license.workspace = true
version.workspace = true
autobins = false
default-run = "AIProxy"

[[bin]]
name = "AIProxy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = true, features = ["clock"] }
aiproxy-db = { path = "../../../crates/db" }
aiproxy-exporter = { path = "../../../crates/exporter" }
aiproxy-proxy-core = { path = "../../../crates/proxy-core" }
aiproxy-rule-engine = { path = "../../../crates/rule-engine" }
aiproxy-session-store = { path = "../../../crates/session-store" }
aiproxy-throttle-engine = { path = "../../../crates/throttle-engine" }
aiproxy-tls-manager = { path = "../../../crates/tls-manager" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }
dirs = "6"
mime_guess = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinInet"] }
winreg = "0.55"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
