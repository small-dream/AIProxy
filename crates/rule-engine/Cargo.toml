[package]
name = "aiproxy-rule-engine"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
deno_ast = { version = "0.53", features = ["transpiling"] }
regex = "1"
rquickjs = { version = "0.8", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
