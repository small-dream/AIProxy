[package]
name = "aiproxy-proxy-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
aiproxy-rule-engine = { path = "../rule-engine" }
aiproxy-sys-util = { path = "../sys-util" }
aiproxy-tls-manager = { path = "../tls-manager" }
base64 = "0.22"
bytes = "1"
brotli = "8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
# M3: Stream trait + TryStreamExt::map_ok to adapt tokio_util's ReaderStream
# (Stream<Result<Bytes, io::Error>>) into the Stream<Result<Frame<Bytes>, E>>
# that http_body_util::StreamBody expects, for streaming spooled bodies.
futures-util = "0.3"
http = "1"
# M3: http_body::Frame wraps each streamed Bytes chunk for http_body_util::StreamBody.
http-body = "1"
h2 = "0.4"
http-body-util = "0.1"
httparse = "1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server", "tokio"] }
rand = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
# M3: `tokio_util::io::ReaderStream` turns a spooled response file into an
# async `Stream<Bytes>` we can feed into http_body_util::StreamBody, so large
# spooled responses are streamed back to the client instead of read fully into
# memory. Only the `io` feature is needed.
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tower-service = "0.3"
url = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "body_decompress"
harness = false
